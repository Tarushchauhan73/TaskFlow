services:
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: taskflow-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskflow
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo-data:
